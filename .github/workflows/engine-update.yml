name: Engine update

# Verifica semanalmente se há release nova do llama.cpp e abre um PR que só troca
# ENGINE_TAG. O motor continua fixo; a validação manual acontece antes do merge.
on:
  schedule:
    - cron: '0 12 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engine-update
  cancel-in-progress: false

jobs:
  propose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ secrets.ENGINE_UPDATE_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          token: ${{ secrets.ENGINE_UPDATE_TOKEN || github.token }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Compare pinned and latest release
        id: tags
        run: |
          current=$(sed -nE "s/^const ENGINE_TAG='(b[0-9]+)';$/\1/p" src/engine.ts)
          latest=$(gh api repos/ggml-org/llama.cpp/releases/latest --jq .tag_name)
          [[ "$current" =~ ^b[0-9]+$ && "$latest" =~ ^b[0-9]+$ ]] || { echo "Tag inválida: '$current' / '$latest'"; exit 1; }
          branch="chore/engine-$latest"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          if (( ${latest#b} <= ${current#b} )); then
            echo "Motor já está em $current."; echo "update=false" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "Branch $branch já existe."; echo "update=false" >> "$GITHUB_OUTPUT"
          else
            echo "update=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.tags.outputs.update == 'true'
        run: npm ci

      - name: Update ENGINE_TAG and check release assets
        if: steps.tags.outputs.update == 'true'
        env:
          CURRENT: ${{ steps.tags.outputs.current }}
          LATEST: ${{ steps.tags.outputs.latest }}
        run: |
          sed -i "s/^const ENGINE_TAG='$CURRENT';$/const ENGINE_TAG='$LATEST';/" src/engine.ts
          grep -q "^const ENGINE_TAG='$LATEST';$" src/engine.ts
          npm run build
          node scripts/check-engine-release.js
          npm test

      - name: Open pull request
        if: steps.tags.outputs.update == 'true'
        env:
          CURRENT: ${{ steps.tags.outputs.current }}
          LATEST: ${{ steps.tags.outputs.latest }}
          BRANCH: ${{ steps.tags.outputs.branch }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$BRANCH"
          git commit -am "chore(engine): update llama.cpp from $CURRENT to $LATEST"
          git push origin "$BRANCH"
          cat > "$RUNNER_TEMP/body.md" <<EOF
          Troca \`ENGINE_TAG\` de \`$CURRENT\` para \`$LATEST\`. Todos os pacotes dos backends oferecidos existem na release e os testes passaram.

          Mudanças: https://github.com/ggml-org/llama.cpp/compare/$CURRENT...$LATEST

          Antes do merge:
          - [ ] Baixar o motor pelo app e carregar um GGUF (\`/health\`, \`/v1/models\`, \`llama-cli\`, \`llama-bench\`)
          - [ ] Atualizar a versão testada em README, PLAN e manuais, e regenerar os PDFs
          - [ ] Subir a versão em \`package.json\` / \`package-lock.json\`
          EOF
          gh pr create --base main --head "$BRANCH" --title "chore(engine): llama.cpp $LATEST" --body-file "$RUNNER_TEMP/body.md"
