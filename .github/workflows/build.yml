name: Build installers
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            id: windows-x64
            command: dist:win
          - os: ubuntu-latest
            id: linux-x64
            command: dist:linux
          - os: ubuntu-24.04-arm
            id: linux-arm64
            command: dist:linux
          - os: macos-latest
            id: macos-arm64
            command: dist:mac
          - os: macos-15-intel
            id: macos-x64
            command: dist:mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      # electron-builder only ships an x86 fpm binary; on ARM64 use a native fpm from RubyGems.
      - if: runner.os == 'Linux' && runner.arch == 'ARM64'
        run: |
          sudo apt-get install -y ruby ruby-dev build-essential
          sudo gem install --no-document fpm
          fpm --version
          echo "USE_SYSTEM_FPM=true" >> "$GITHUB_ENV"
      - run: npm run ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.id }}
          path: dist/*
