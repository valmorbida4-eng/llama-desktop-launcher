name: Build installers
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            id: windows-x64
            command: dist:win
          - os: ubuntu-latest
            id: linux-x64
            command: dist:linux
          - os: ubuntu-24.04-arm
            id: linux-arm64
            command: dist:linux
          - os: macos-latest
            id: macos-arm64
            command: dist:mac
          - os: macos-15-intel
            id: macos-x64
            command: dist:mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run version:check
      - run: npm test
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      # electron-builder only ships an x86 fpm binary; on ARM64 use a native fpm from RubyGems.
      - if: runner.os == 'Linux' && runner.arch == 'ARM64'
        run: |
          sudo apt-get install -y ruby ruby-dev build-essential
          sudo gem install --no-document fpm -v 1.18.0
          fpm --version
          echo "USE_SYSTEM_FPM=true" >> "$GITHUB_ENV"
      - run: npm run ${{ matrix.command }}
      - name: Stage final package files
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          MATRIX_ID: ${{ matrix.id }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const destination = path.join('release-stage', process.env.MATRIX_ID);
          fs.mkdirSync(destination, { recursive: true });
          const packageExtensions = new Set(['.exe', '.dmg', '.appimage', '.deb', '.rpm']);
          const files = fs.readdirSync('dist', { withFileTypes: true })
            .filter((entry) => entry.isFile() && packageExtensions.has(path.extname(entry.name).toLowerCase()));
          const expectedCount = process.env.MATRIX_ID.startsWith('linux-') ? 3 : 1;
          if (files.length !== expectedCount) {
            throw new Error(`Expected ${expectedCount} installer files for ${process.env.MATRIX_ID}; found ${files.length}.`);
          }
          for (const file of files) {
            fs.copyFileSync(path.join('dist', file.name), path.join(destination, file.name));
          }
          NODE
      # Caches avoid the 500 MB Actions-artifact allowance, but remain subject
      # to cache quota and eviction. A missing cache fails the release closed.
      # Include run_attempt so reruns cannot publish stale binaries from a prior attempt.
      - uses: actions/cache/save@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          path: release-stage/${{ matrix.id }}
          key: release-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.id }}
          enableCrossOsArchive: true

  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Restore Windows x64 package cache
        uses: actions/cache/restore@v4
        with:
          path: release-stage/windows-x64
          key: release-${{ github.run_id }}-${{ github.run_attempt }}-windows-x64
          fail-on-cache-miss: true
          enableCrossOsArchive: true
      - name: Restore Linux x64 package cache
        uses: actions/cache/restore@v4
        with:
          path: release-stage/linux-x64
          key: release-${{ github.run_id }}-${{ github.run_attempt }}-linux-x64
          fail-on-cache-miss: true
          enableCrossOsArchive: true
      - name: Restore Linux ARM64 package cache
        uses: actions/cache/restore@v4
        with:
          path: release-stage/linux-arm64
          key: release-${{ github.run_id }}-${{ github.run_attempt }}-linux-arm64
          fail-on-cache-miss: true
          enableCrossOsArchive: true
      - name: Restore macOS ARM64 package cache
        uses: actions/cache/restore@v4
        with:
          path: release-stage/macos-arm64
          key: release-${{ github.run_id }}-${{ github.run_attempt }}-macos-arm64
          fail-on-cache-miss: true
          enableCrossOsArchive: true
      - name: Restore macOS x64 package cache
        uses: actions/cache/restore@v4
        with:
          path: release-stage/macos-x64
          key: release-${{ github.run_id }}-${{ github.run_attempt }}-macos-x64
          fail-on-cache-miss: true
          enableCrossOsArchive: true
      - name: Assemble release files
        run: |
          mkdir -p release-artifacts
          for platform in windows-x64 linux-x64 linux-arm64 macos-arm64 macos-x64; do
            for file in release-stage/"$platform"/*; do
              [ -f "$file" ] || continue
              name="${file##*/}"
              if [ -e "release-artifacts/$name" ]; then
                echo "Duplicate release asset name: $name" >&2
                exit 1
              fi
              cp "$file" release-artifacts/
            done
          done
          test "$(find release-artifacts -maxdepth 1 -type f | wc -l)" -gt 0
      - name: Generate SHA256 checksums
        working-directory: release-artifacts
        run: |
          for f in *; do
            if [ -f "$f" ] && [ "$f" != "SHA256SUMS.txt" ]; then
              sha256sum "$f"
            fi
          done > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          generate_release_notes: true
